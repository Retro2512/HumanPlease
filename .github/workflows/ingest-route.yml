name: Intake route

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: route-intake
  cancel-in-progress: false

jobs:
  intake:
    if: github.event.label.name == 'route-approved' && startsWith(github.event.issue.title, '[route]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Read and validate submission
        id: intake
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: node scripts/ingest-issue.mjs "$EVENT_PATH"
      - name: Open route pull request
        if: steps.intake.outputs.status == 'created' || steps.intake.outputs.status == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          SITE: ${{ steps.intake.outputs.site }}
          LOCALE: ${{ steps.intake.outputs.locale }}
          POSITION: ${{ steps.intake.outputs.position }}
          SCORE: ${{ steps.intake.outputs.score_seconds }}
        run: |
          branch="route/issue-$ISSUE"
          git config user.name "humanplease-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add routes archive catalog.json
          git commit -m "Record route timing for $SITE ($LOCALE)"
          git push origin "$branch"
          gh pr create --repo "$REPO" --base main --head "$branch" --title "Record route timing for $SITE ($LOCALE)" --body "Adds the privacy-checked timing from #$ISSUE. Ranking position: **$POSITION**. Comparison score: **$SCORE seconds**."
