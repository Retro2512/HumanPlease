# Include inside the HTTPS server block that serves press-zero/.
server_tokens off;
autoindex off;
client_max_body_size 1k;

if ($request_method !~ ^(GET|HEAD)$) { return 405; }

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://humanplease-reports.sudhan2512.workers.dev; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; form-action 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

location ~ /\.(?!well-known/) { deny all; }

# JSON is public data, but browsers should never infer an executable type.
location ~* ^/data/.*\.json$ {
    default_type application/json;
    try_files $uri =404;
}
