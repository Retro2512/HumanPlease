<div class="sheet" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header class="bar">
  <div class="wrap">
    <a class="mark" href="index.html">Human<em>,</em> Please</a>

<main class="stage" id="stage">
  <div class="wrap ask">

    <h1 class="q wide">Who do you wanna call today<b>?</b></h1>

      <span class="rule"></span>
    </div>

    <div class="tray" id="tray">
      <div class="scroll" id="results" role="listbox" aria-label="Matching companies"></div>
    </div>

  </div>

  <div class="wrap">
  <div class="counts" id="counts">
    <div>
      <span class="n">0</span>
      <span class="c">total companies and services</span>
    </div>
    <div>
      <span class="n">0</span>
      <span class="c">total phone numbers</span>
    </div>
    <div>
      <span class="n">0</span>
      <span class="c">countries and territories</span>
    </div>
  </div>

  </div>
